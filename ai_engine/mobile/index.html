<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self'; style-src 'unsafe-inline'; connect-src 'self'; media-src 'self' blob:; base-uri 'none'; form-action 'none'">
  <title>LEO Shield · Phone capture</title>
  <style>
    * { box-sizing: border-box; }
    body { margin: 0; background: #f2f6f3; color: #143026; font: 16px system-ui, sans-serif; }
    main { max-width: 36rem; margin: auto; padding: 1.5rem 1rem; }
    h1 { margin: 0 0 .4rem; }
    p, output { line-height: 1.5; }
    form, section { padding: 1rem; margin-top: 1rem; background: white; border-radius: .75rem; }
    label { display: block; margin: .6rem 0 .25rem; }
    input, select, button { width: 100%; min-height: 2.75rem; padding: .5rem; font: inherit; }
    button { background: #17513b; border: 1px solid #17513b; border-radius: .45rem; color: white; margin-top: .6rem; }
    button:disabled { opacity: .55; }
    video { width: 100%; border-radius: .45rem; margin-top: .7rem; }
    output { display: block; margin-top: .5rem; overflow-wrap: anywhere; }
    [hidden] { display: none !important; }
  </style>
  <script src="./capture.js" defer></script>
</head>
<body>
<main>
  <h1>LEO Shield</h1>
  <p>Keep all edges of the item in frame. Use even light and a plain background.</p>
  <form id="setup">
    <label for="product">Product ID</label>
    <input id="product" maxlength="128" required>
    <label for="lot">Lot ID</label>
    <input id="lot" maxlength="128" required>
    <label for="token">Local access token</label>
    <input id="token" type="password" autocomplete="off">
    <label for="lighting">Lighting</label>
    <select id="lighting">
      <option value="unknown">Unknown</option>
      <option value="manual_diffuse">Diffuse and even</option>
      <option value="manual_top">Top directional</option>
      <option value="manual_left">Left directional</option>
      <option value="manual_right">Right directional</option>
      <option value="manual_front">Front directional</option>
      <option value="manual_back">Back directional</option>
    </select>
    <button type="button" id="automatic" hidden>Start automatic camera</button>
    <button type="button" id="stop-camera" hidden>Stop camera</button>
    <button type="button" id="native">Open phone camera</button>
    <button type="button" id="choose">Choose a JPEG or PNG</button>
    <input id="camera-file" type="file" accept="image/jpeg,image/png" capture="environment" hidden>
    <input id="image-file" type="file" accept="image/jpeg,image/png" hidden>
    <video id="preview" autoplay muted playsinline hidden></video>
  </form>
  <section aria-labelledby="next">
    <h2 id="next">Front view</h2>
    <output id="status" role="status" aria-live="polite">Photos upload automatically after capture or selection.</output>
    <button type="button" id="restart" hidden>Start another inspection</button>
  </section>
</main>
</body>
</html>
